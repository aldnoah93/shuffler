<section class="mx-auto flex flex-col items-center mt-8 p-4">
  <div class="flex flex-col md:flex-row items-start w-full space-y-6 md:space-y-0 md:space-x-8">
    <div class="w-full md:w-1/3">
      <app-shuffle-input-form (newItemEvent)="addItem($event)"></app-shuffle-input-form>
    </div>
    <div class="w-full md:w-1/3">
      <app-shuffle-list class="flex-1" [listTitle]="'Added items'" [shuffleListItem]="shuffleItems"
        (itemDeleteByIdEvent)="deleteItemById($event)"></app-shuffle-list>
    </div>
    <div class="w-full md:w-1/3 flex flex-col items-center space-y-4">
      <button mat-raised-button (click)="shuffle()" color="accent" class="self-center">
        <mat-icon aria-hidden="false" aria-label="Shuffle icon">autorenew</mat-icon>
      </button>
      <app-shuffle-list class="flex-1 w-full" [listTitle]="'Shuffled items'" [shuffleListItem]="shuffledItems"
        (itemDeleteByIdEvent)="deleteItemById($event)"></app-shuffle-list>
    </div>
  </div>
</section>
