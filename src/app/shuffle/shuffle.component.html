<div class="app-shell flex min-h-screen min-h-[100dvh] flex-col gap-6 py-6 sm:py-7">
  <app-shuffle-header
    [sourceItemsCount]="shuffleItems.length"
    [shuffledItemsCount]="shuffledItems.length"
    [canCopy]="canCopy"
    [canClearShuffled]="canClearShuffled"
    [canShuffle]="canShuffle"
    (copyShuffledEvent)="copyShuffledList()"
    (clearShuffledEvent)="clearShuffled()"
    (clearAllEvent)="confirmClearAll()"
    (shuffleEvent)="shuffle()"></app-shuffle-header>

  <main class="flex flex-1 flex-col gap-7 pb-32 lg:pb-0">
    <section class="grid gap-5 lg:grid-cols-[minmax(17rem,22rem)_minmax(0,1fr)] xl:gap-6">
      <app-shuffle-input-form class="block" (addItemsEvent)="addItems($event)"></app-shuffle-input-form>

      <section class="flex flex-col gap-5">
        <section class="glass-panel flex flex-col gap-5 p-7 sm:p-8">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <p class="app-kicker">Status</p>
              <h2 class="m-0 pt-2 font-serif text-[1.6rem] leading-[1.08] text-[var(--app-text)]">What happens next</h2>
              <p class="m-0 pt-2 leading-[1.65] text-[var(--app-muted)]">
                {{ statusHint }}
              </p>
            </div>

            <span [class]="statusChipClass">
              <span class="app-dot"></span>
              {{ statusLabel }}
            </span>
          </div>

          @if (status === 'invalidated') {
            <div class="rounded-[20px] border border-[rgba(239,159,69,0.22)] bg-[rgba(239,159,69,0.12)] px-5 py-4 text-[0.95rem] leading-[1.6] text-[#8c5316]">
              Source changed. Shuffle again to generate a new order.
            </div>
          }
        </section>

        <section class="hidden lg:grid lg:grid-cols-2 lg:gap-6">
          <app-shuffle-list
            class="block"
            [listEyebrow]="'Source'"
            [listTitle]="'Original order'"
            [listHint]="'Edit or remove items here. This list is the source of truth.'"
            [emptyTitle]="'Your source list is empty.'"
            [emptyMessage]="'Add items in the input panel and they will appear here immediately.'"
            [shuffleListItem]="shuffleItems"
            [canEdit]="true"
            [canDelete]="true"
            (itemDeleteEvent)="deleteItem($event)"
            (itemEditEvent)="editItem($event)"></app-shuffle-list>

          <app-shuffle-list
            class="block"
            [listEyebrow]="'Output'"
            [listTitle]="'Shuffled order'"
            [listHint]="'Generated output stays read-only until you run another shuffle.'"
            [emptyTitle]="shuffledEmptyTitle"
            [emptyMessage]="shuffledEmptyMessage"
            [shuffleListItem]="shuffledItems"
            [readOnly]="true"
            [canDelete]="false"
            [canEdit]="false"></app-shuffle-list>
        </section>

        <section class="glass-panel overflow-hidden lg:hidden">
          <mat-tab-group [selectedIndex]="mobileTabIndex" (selectedIndexChange)="onMobileTabIndexChange($event)" dynamicHeight>
            <mat-tab [label]="'Original (' + shuffleItems.length + ')'">
              <div class="p-6 pt-4 sm:p-7 sm:pt-5">
                <app-shuffle-list
                  class="block"
                  [listEyebrow]="'Source'"
                  [listTitle]="'Original order'"
                  [listHint]="'Edit or remove items here. This list is the source of truth.'"
                  [emptyTitle]="'Your source list is empty.'"
                  [emptyMessage]="'Add items in the input panel and they will appear here immediately.'"
                  [shuffleListItem]="shuffleItems"
                  [canEdit]="true"
                  [canDelete]="true"
                  (itemDeleteEvent)="deleteItem($event)"
                  (itemEditEvent)="editItem($event)"></app-shuffle-list>
              </div>
            </mat-tab>

            <mat-tab [label]="'Shuffled (' + shuffledItems.length + ')'">
              <div class="p-6 pt-4 sm:p-7 sm:pt-5">
                <app-shuffle-list
                  class="block"
                  [listEyebrow]="'Output'"
                  [listTitle]="'Shuffled order'"
                  [listHint]="'Generated output stays read-only until you run another shuffle.'"
                  [emptyTitle]="shuffledEmptyTitle"
                  [emptyMessage]="shuffledEmptyMessage"
                  [shuffleListItem]="shuffledItems"
                  [readOnly]="true"
                  [canDelete]="false"
                  [canEdit]="false"></app-shuffle-list>
              </div>
            </mat-tab>
          </mat-tab-group>
        </section>
      </section>
    </section>
  </main>

  <div class="mobile-action-bar lg:hidden">
    <div class="mobile-action-bar__panel">
      <button mat-flat-button class="rounded-full !bg-white !px-5 !text-white !shadow-[0_18px_34px_rgba(8,22,29,0.18)]" (click)="shuffle()" [disabled]="!canShuffle">
        Shuffle
      </button>
      <button mat-flat-button class="rounded-full !bg-white !px-5 !text-white !shadow-[0_18px_34px_rgba(8,22,29,0.18)]" (click)="copyShuffledList()" [disabled]="!canCopy">
        Copy
      </button>
      <button mat-icon-button [matMenuTriggerFor]="mobileActionMenu" aria-label="More actions">
        <mat-icon>more_horiz</mat-icon>
      </button>
    </div>
  </div>

  <mat-menu #mobileActionMenu="matMenu">
    <button mat-menu-item (click)="clearShuffled()" [disabled]="!canClearShuffled">
      <mat-icon>layers_clear</mat-icon>
      <span>Clear shuffled</span>
    </button>
    <button mat-menu-item (click)="confirmClearAll()" [disabled]="!shuffleItems.length">
      <mat-icon>delete_sweep</mat-icon>
      <span>Clear all</span>
    </button>
  </mat-menu>
</div>
