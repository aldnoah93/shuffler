<header class="sticky top-0 z-40 border-b border-white/40 bg-[rgba(255,252,248,0.72)] px-4 py-3 shadow-[0_12px_32px_rgba(27,46,56,0.08)] backdrop-blur-2xl sm:px-6 lg:px-8">
  <mat-toolbar
    class="rounded-[28px] border border-white/10 bg-gradient-to-r from-[#0c3543] via-[#12636b] to-[#245f83] text-[#f7faf9] shadow-[0_22px_42px_rgba(12,35,44,0.22)]">
    <mat-toolbar-row class="flex w-full items-center gap-3 !min-h-[72px] !px-3 !py-0 sm:gap-4 sm:!min-h-[80px] sm:!px-4">
      <button
        mat-icon-button
        class="shrink-0 rounded-full border border-white/15 bg-white/10 text-white shadow-inner shadow-white/10 backdrop-blur"
        (click)="toggle()"
        aria-label="Open navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="flex min-w-0 flex-col gap-1">
        <p class="m-0 text-[0.72rem] uppercase tracking-[0.24em] text-white/65">Tailwind-powered randomizer</p>
        <div class="flex min-w-0 items-center gap-3">
          <h1 class="m-0 truncate font-serif text-2xl font-bold tracking-[0.02em] sm:text-[2rem]">{{ title }}</h1>
          <span
            class="hidden rounded-full border border-white/15 bg-white/10 px-3 py-1 text-[0.72rem] font-medium uppercase tracking-[0.18em] text-white/75 md:inline-flex">
            Full-window workspace
          </span>
        </div>
      </div>
      <span class="flex-1"></span>
      <div class="hidden rounded-full border border-white/15 bg-white/10 px-4 py-2 text-right xl:block">
        <p class="m-0 text-[0.7rem] uppercase tracking-[0.18em] text-white/60">Layout</p>
        <p class="m-0 text-[0.94rem] leading-[1.35] text-white/85">Sticky header, spacious panels, instant shuffle.</p>
      </div>
    </mat-toolbar-row>
  </mat-toolbar>
</header>
