<form [formGroup]="form" (ngSubmit)="save()" class="p-6 sm:p-7">
  <p class="app-kicker">Edit source item</p>
  <h2 class="m-0 pt-2 font-serif text-[1.9rem] leading-[1.05] text-[var(--app-text)]">Update the original entry</h2>
  <p class="m-0 pt-4 text-[0.98rem] leading-[1.65] text-[var(--app-muted)]">
    Saving here updates the source list and invalidates any existing shuffled result.
  </p>

  <div class="pt-5">
    <mat-form-field appearance="outline">
      <mat-label>Item description</mat-label>
      <textarea matInput cdkTextareaAutosize cdkAutosizeMinRows="4" cdkAutosizeMaxRows="8" formControlName="description"></textarea>
      @if (descriptionControl.touched && descriptionControl.invalid) {
        <mat-error>Enter a non-empty description.</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="flex flex-col-reverse gap-3 pt-6 sm:flex-row sm:justify-end">
    <button mat-stroked-button type="button" class="rounded-full" (click)="close()">Cancel</button>
    <button mat-flat-button type="submit" class="rounded-full !bg-[var(--app-primary)] !text-white">Save changes</button>
  </div>
</form>
